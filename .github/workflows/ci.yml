name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Bootstrap install until the first generated pnpm-lock.yaml is committed.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Diagnose Prettier formatting
        run: |
          pnpm --filter @app/desktop exec prettier --write scripts/electron-runtime-smoke.mjs src/renderer/src/App.tsx src/renderer/src/model.test.ts src/renderer/src/model.ts src/renderer/src/styles.css
          git diff --no-ext-diff --unified=2 -- apps/desktop/scripts/electron-runtime-smoke.mjs apps/desktop/src/renderer/src/App.tsx apps/desktop/src/renderer/src/model.test.ts apps/desktop/src/renderer/src/model.ts apps/desktop/src/renderer/src/styles.css
          exit 1

      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Electron runtime smoke test
        run: xvfb-run -a pnpm --filter @app/desktop test:e2e
