name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Diagnose Electron smoke test formatting
        run: |
          pnpm exec prettier apps/desktop/scripts/electron-runtime-smoke.mjs > /tmp/electron-runtime-smoke.formatted.mjs
          diff -u apps/desktop/scripts/electron-runtime-smoke.mjs /tmp/electron-runtime-smoke.formatted.mjs || true
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Electron runtime smoke test
        run: xvfb-run -a pnpm --filter @app/desktop test:e2e
